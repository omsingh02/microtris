# DOSBox settings for playing build/microtris.com (make play). The program has no timer, so its speed is the emulated
# CPU's: a fixed cycle count is what makes it playable. Ctrl+F11 / Ctrl+F12 slow down / speed up while it runs.
[sdl]
fullscreen=false
autolock=false
[dosbox]
machine=vgaonly
[cpu]
core=normal
cycles=fixed 400
[mixer]
nosound=true
[autoexec]
mount c build/play
c:
cls
tetris.com
